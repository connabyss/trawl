[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trawl-lang"
version = "0.1.0"
description = "Trawl: a small language for hunting patterns in the integers, with a native compiler"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Compilers",
]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]

[project.scripts]
trawl = "trawl.cli:main"

[tool.setuptools]
packages = ["trawl"]

[tool.setuptools.package-data]
trawl = ["runtime/*.h", "lib/*.trawl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
