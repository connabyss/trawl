name: tests
on:
  push:
    branches: [main]
  pull_request:
# Read-only token: the tests only need to check out the code.
permissions:
  contents: read
# a new push to the same PR stops its older run instead of queueing behind it
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[test]
      # -n auto: the same tests, spread over every core the runner has (pytest-xdist)
      - run: python -m pytest -q --all -n auto
  playground:
    # The playground clicked through in a real browser (about 4 minutes). On a PR it only runs when
    # something it shows can change: the page, the interpreter and libraries it bundles, the examples,
    # or its own test. Otherwise the job passes in seconds, so it can stay a required check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python playground/build.py --check
      - id: changed
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ] || git diff --name-only "origin/$BASE...HEAD" \
               | grep -qE '^(playground/|trawl/|examples/|tests/playground/|\.github/workflows/test\.yml$)'; then
            echo "browser=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the playground shows changed, so the browser test is skipped."
          fi
      - if: steps.changed.outputs.browser == 'yes'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - if: steps.changed.outputs.browser == 'yes'
        run: npm install
        working-directory: tests/playground
      - if: steps.changed.outputs.browser == 'yes'
        run: npx playwright install --with-deps chromium
        working-directory: tests/playground
      - if: steps.changed.outputs.browser == 'yes'
        run: node state.test.js
        working-directory: tests/playground
