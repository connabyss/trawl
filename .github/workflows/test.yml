name: tests
on:
  push:
    branches: [main]
  pull_request:
# Read-only token: the tests only need to check out the code.
permissions:
  contents: read
# a new push to the same PR stops its older run instead of queueing behind it
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[test]
      # -n auto: the same tests, spread over every core the runner has (pytest-xdist)
      - run: python -m pytest -q --all -n auto
  playground-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python playground/build.py --check
