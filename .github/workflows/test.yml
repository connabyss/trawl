name: tests
on:
  push:
    branches: [main]
  pull_request:
# Read-only token: the tests only need to check out the code.
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[test]
      - run: python -m pytest -q --all
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python playground/build.py --check
      - run: npm install
        working-directory: tests/playground
      - run: npx playwright install --with-deps chromium
        working-directory: tests/playground
      - run: node state.test.js
        working-directory: tests/playground
