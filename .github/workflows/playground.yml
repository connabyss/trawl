name: playground
# The playground clicked through in a real browser (about 4 minutes). It only runs when something it
# shows can change: the page, the interpreter and libraries it bundles, the examples, or this test.
on:
  push:
    branches: [main]
    paths:
      - "playground/**"
      - "trawl/**"
      - "examples/**"
      - "tests/playground/**"
      - ".github/workflows/playground.yml"
  pull_request:
    paths:
      - "playground/**"
      - "trawl/**"
      - "examples/**"
      - "tests/playground/**"
      - ".github/workflows/playground.yml"
permissions:
  contents: read
concurrency:
  group: playground-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python playground/build.py --check
      - run: npm install
        working-directory: tests/playground
      - run: npx playwright install --with-deps chromium
        working-directory: tests/playground
      - run: node state.test.js
        working-directory: tests/playground
