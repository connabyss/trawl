<text x="18" y="344" opacity="0" xml:space="preserve"><tspan fill="#e6edf3">a(9) = 2935782889 was found in 2021. Then the table sat still for five years.</tspan><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5681;0.985" calcMode="discrete" dur="25.7s" repeatCount="indefinite"/></text>
<text x="18" y="366" opacity="0" xml:space="preserve"><tspan fill="#e3b341" font-weight="bold">a(10), a(11), a(12) were found in November 2026 and are now in the OEIS.</tspan><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6109;0.985" calcMode="discrete" dur="25.7s" repeatCount="indefinite"/></text>
<text x="18" y="388" opacity="0" xml:space="preserve"><tspan fill="#e6edf3">This same search reproduces them: 8 minutes, 33 minutes, about 5 hours on 6 cores.</tspan><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6498;0.985" calcMode="discrete" dur="25.7s" repeatCount="indefinite"/></text>
